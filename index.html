    // 2. Inicializar mapa deshabilitando el control de zoom por defecto
    const map = L.map('map', {
        zoomControl: false
    }).setView(routeCoords[0], 13);

    // 3. Colocar controles de Zoom (+ / -) en la esquina superior derecha
    L.control.zoom({
        position: 'topright'
    }).addTo(map);

    // 4. Definición de Capas Base
    
    // Capa ESRI Topo Map solicitada (Por Defecto)
    const esriTopoMap = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 19,
        attribution: 'Tiles &copy; Esri'
    });

    // Capa tipo Street View de OpenStreetMap
    const osmStreet = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    });

    // Capa Satélite de Esri
    const esriSatellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 18,
        attribution: 'Tiles &copy; Esri'
    });

    // Activar Esri Satélite de inicio
    esriSatellite.addTo(map);

    // 5. Selector de capas en la parte superior derecha
    const baseMaps = {
        "⛰️ Esri World Topo": esriTopoMap,
        "🗺️ Calles (OpenStreetMap)": osmStreet,
        "🛰️ Satélite (Esri)": esriSatellite
    };

    L.control.layers(baseMaps, null, { position: 'topright' }).addTo(map);

    // 6. Dibujar Línea de la Ruta
    const polyline = L.polyline(routeCoords, {
        color: '#2f529a',
        weight: 6,
        opacity: 0.85
    }).addTo(map);

    // Marcadores de inicio y fin
    L.marker(routeCoords[0]).addTo(map).bindPopup("<b>Punto de Inicio</b>");
    L.marker(routeCoords[routeCoords.length - 1]).addTo(map).bindPopup("<b>Destino Final</b>");

    // Ajustar encuadre de la vista
    map.fitBounds(polyline.getBounds(), { padding: [30, 30] });

    // 7. Rastreo GPS
    let userMarker = null;
    const statusDiv = document.getElementById('gps-status');

    map.locate({ setView: false, watch: true, enableHighAccuracy: true });

    map.on('locationfound', function(e) {
        statusDiv.innerHTML = "GPS Conectado | Rastreando...";
        statusDiv.style.color = "#27ae60";

        if (!userMarker) {
            userMarker = L.circleMarker(e.latlng, {
                radius: 8,
                color: '#ffffff',
                fillColor: '#2980b9',
                fillOpacity: 1,
                weight: 3
            }).addTo(map).bindPopup("Ubicación del Operador");
        } else {
            userMarker.setLatLng(e.latlng);
        }
    });

    map.on('locationerror', function(e) {
        statusDiv.innerHTML = "GPS no disponible o denegado.";
        statusDiv.style.color = "#c0392b";
    });
