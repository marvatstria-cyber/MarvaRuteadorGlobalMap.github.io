<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Prueba de Concepto - Visor de Ruta</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: Arial, sans-serif; }
        #map { height: 100vh; width: 100vw; }
        
        .panel {
            position: absolute; top: 12px; left: 12px; z-index: 1000;
            background: rgba(255, 255, 255, 0.95); padding: 12px 16px;
            border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.25);
            font-size: 13px; max-width: 260px;
        }
        .panel h3 { margin: 0 0 6px 0; font-size: 15px; color: #2c3e50; }
        .status { font-size: 12px; font-weight: bold; color: #34495e; }
        .btn-voicely {
            display: block; width: 100%; margin-top: 10px; padding: 8px 0;
            background: #27ae60; color: white; border: none; border-radius: 5px;
            text-align: center; font-weight: bold; cursor: pointer; text-decoration: none;
        }
    </style>
</head>
<body>

<div class="panel">
    <h3>📌 Monitoreo de Ruta</h3>
    <div id="status" class="status">Cargando KML...</div>
    <div id="gps-info" style="font-size:11px; color:#7f8c8d; margin-top:4px;">GPS: Buscando...</div>
    <a id="btn-gmaps" class="btn-voicely" href="#" target="_blank" style="display:none;">
        🚗 Abrir Navegación por Voz
    </a>
</div>

<div id="map"></div>

<!-- Leaflet + Omnivore (Parsea KML automáticamente) -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-omnivore@0.3.4/leaflet-omnivore.min.js"></script>

<script>
    // 1. Obtener URL del KML mediante el parámetro ?kml=
    const urlParams = new URLSearchParams(window.location.search);
    const kmlUrl = urlParams.get('kml');

    // 2. Inicializar mapa con controles de zoom en la esquina superior derecha
    const map = L.map('map', { zoomControl: false }).setView([25.8, -100.2], 12);
    L.control.zoom({ position: 'topright' }).addTo(map);

    // 3. Capas base
    const esriTopo = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 19, attribution: 'Tiles &copy; Esri'
    }).addTo(map);

    const osmStreet = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19, attribution: '&copy; OpenStreetMap'
    });

    const esriSat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 18, attribution: 'Tiles &copy; Esri'
    });

    // Control de capas a la derecha
    L.control.layers({
        "⛰️ Esri World Topo": esriTopo,
        "🗺️ Calles (OSM)": osmStreet,
        "🛰️ Satélite": esriSat
    }, null, { position: 'topright' }).addTo(map);

    // 4. Cargar y dibujar el KML desde Cloudinary
    if (kmlUrl) {
        const customLayer = L.geoJson(null, {
            style: function() {
                return { color: '#0142c8', weight: 6, opacity: 0.85 };
            }
        });

        const kmlLayer = omnivore.kml(kmlUrl, null, customLayer)
            .on('ready', function() {
                map.fitBounds(kmlLayer.getBounds(), { padding: [30, 30] });
                document.getElementById('status').innerText = "Ruta Cargada Correctamente";
                document.getElementById('status').style.color = "#27ae60";

                // Habilitar botón para abrir destino en Google Maps para voz
                const bounds = kmlLayer.getBounds();
                const destLat = bounds.getSouthEast().lat;
                const destLng = bounds.getSouthEast().lng;
                const gmapsBtn = document.getElementById('btn-gmaps');
                gmapsBtn.href = `https://www.google.com/maps/dir/?api=1&destination=${destLat},${destLng}&travelmode=driving`;
                gmapsBtn.style.display = "block";
            })
            .on('error', function() {
                document.getElementById('status').innerText = "Error al descargar el KML";
                document.getElementById('status').style.color = "#c0392b";
            })
            .addTo(map);
    } else {
        document.getElementById('status').innerText = "Sin parámetro ?kml=";
    }

    // 5. GPS en tiempo real
    let userMarker = null;
    map.locate({ setView: false, watch: true, enableHighAccuracy: true });

    map.on('locationfound', function(e) {
        document.getElementById('gps-info').innerText = "GPS: Activo y Rastreando";
        if (!userMarker) {
            userMarker = L.circleMarker(e.latlng, {
                radius: 8, color: '#ffffff', fillColor: '#2980b9', fillOpacity: 1, weight: 3
            }).addTo(map).bindPopup("Ubicación del Operador");
        } else {
            userMarker.setLatLng(e.latlng);
        }
    });

    map.on('locationerror', function() {
        document.getElementById('gps-info').innerText = "GPS: No disponible o denegado";
    });
</script>
</body>
</html>
